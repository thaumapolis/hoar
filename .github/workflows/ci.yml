name: check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The same command as local development: build, staleness guard, physics
      # rules, then browser assertions against the generated artifact.
      - name: check
        run: nix develop --command ./check.sh

      - name: build artifact
        run: nix build --print-build-logs
